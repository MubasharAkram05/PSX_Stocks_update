<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSX Daily Price Tracker</title>
<link rel="stylesheet" href="/styles/nav.css" />
<link rel="stylesheet" href="/styles/tracker.css" />
</head>
<body>
<nav class="topnav">
  <div class="topnav-inner">
    <a href="/" class="topnav-brand">PSX Tools</a>
    <div class="topnav-links">
      <a href="/" class="active">Home</a>
      <a href="/stocks.html">Stocks</a>
      <a href="/short-term.html">Short Term</a>
    </div>
  </div>
  <div class="topnav-index" id="topnavIndex"></div>
</nav>

<div class="layout">

  <div class="card">
    <h1>PSX Daily Price Tracker</h1>
    <p class="sub">Enter a PSX symbol (e.g. ENGRO, MEBL, LUCK). Today's low and high price will be saved.</p>
    <input id="symbol" placeholder="e.g. ENGRO" autocomplete="off" />
    <button id="saveBtn">Save Price</button>
    <div id="status"></div>

    <hr />
    <p class="sub" style="margin-bottom:12px;">Download saved prices (leave dates blank for everything):</p>
    <div class="date-filter">
      <label>From<input type="date" id="downloadFrom" /></label>
      <label>To<input type="date" id="downloadTo" /></label>
    </div>
    <div class="downloads">
      <a class="btn" id="downloadExcelBtn" href="/api/download?format=excel" download>Download Excel</a>
      <a class="btn" id="downloadPdfBtn" href="/api/download?format=pdf" download>Download PDF</a>
    </div>

    <hr />
    <p class="sub" style="margin-bottom:12px;">Remove saved data (permanent — pick a date range):</p>
    <div class="date-filter">
      <label>From<input type="date" id="removeFrom" /></label>
      <label>To<input type="date" id="removeTo" /></label>
    </div>
    <button id="removeBtn" class="danger-btn">Delete Data in Range</button>
    <div id="removeStatus"></div>
  </div>

</div>

<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <div class="modal-title">Confirm Save</div>
    <p class="modal-sub" id="confirmSymbolLine"></p>
    <label class="modal-label">Low Price (Rs.)</label>
    <input type="number" id="confirmLowInput" step="0.01" />
    <label class="modal-label">High Price (Rs.)</label>
    <input type="number" id="confirmHighInput" step="0.01" />
    <div class="modal-actions">
      <button id="confirmCancelBtn" class="secondary-btn">Cancel</button>
      <button id="confirmSaveBtn">Confirm &amp; Save</button>
    </div>
  </div>
</div>

<script src="/scripts/nav.js"></script>
<script src="/scripts/tracker.js"></script>
</body>
</html>
