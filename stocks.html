<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stocks — PSX Tools</title>
<link rel="stylesheet" href="/styles/nav.css" />
<link rel="stylesheet" href="/styles/stocks.css" />
</head>
<body>
<nav class="topnav">
  <div class="topnav-inner">
    <a href="/" class="topnav-brand">PSX Tools</a>
    <div class="topnav-links">
      <a href="/">Home</a>
      <a href="/stocks.html" class="active">Stocks</a>
    </div>
  </div>
  <div class="topnav-index" id="topnavIndex"></div>
</nav>

<div class="page">
  <h1>Stocks by Sector</h1>
  <p class="sub">Add stocks, assign a sector, and remove any you no longer want tracked here. Click a stock to jump to the tracker with it pre-filled.</p>

  <div class="add-form">
    <input id="addSymbol" placeholder="e.g. ENGRO" autocomplete="off" />
    <select id="addSector">
      <option value="petroleum">Petroleum</option>
      <option value="fertilizer">Fertilizer</option>
      <option value="pharma">Medicine</option>
      <option value="cement">Cement</option>
      <option value="tech">Technology</option>
      <option value="power">Power</option>
      <option value="chemical">Chemical</option>
      <option value="auto">Automobile</option>
      <option value="engineering">Engineering</option>
      <option value="steel">Steel</option>
      <option value="bank">Bank</option>
      <option value="other" selected>Other</option>
    </select>
    <button id="addStockBtn">Add Stock</button>
  </div>
  <div id="addStatus" class="status"></div>

  <div id="sectorGroups">
    <p class="placeholder">Loading...</p>
  </div>
</div>

<script src="/scripts/nav.js"></script>
<script src="/scripts/sparkline.js"></script>
<script src="/scripts/stocks.js"></script>
</body>
</html>
